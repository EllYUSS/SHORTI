<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Шорты" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <title>Шорты</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        if (params.has("preview")) return;
        if (!window.matchMedia("(max-width: 600px) and (pointer: coarse)").matches) return;
        params.set("preview", "full");
        location.replace(location.pathname + "?" + params.toString() + location.hash);
      })();
    </script>
    <script>
      (function () {
        if (!new URLSearchParams(location.search).has("preview")) return;
        if (!window.matchMedia("(pointer: coarse)").matches) return;
        var root = document.documentElement;
        if (!root.requestFullscreen) return;
        var enter = function () {
          document.removeEventListener("pointerdown", enter);
          if (!document.fullscreenElement) root.requestFullscreen().catch(function () {});
        };
        document.addEventListener("pointerdown", enter, { passive: true });
      })();
    </script>
    <script>
      // iOS Safari: vh/svh/dvh and the fixed-position containing block all mean
      // different things, and none of them equals the area the user can see.
      // visualViewport reports that rectangle directly, so publish it and let
      // the app size itself from it.
      (function () {
        var vv = window.visualViewport;
        var root = document.documentElement;
        function sync() {
          var h = vv ? vv.height : window.innerHeight;
          var t = vv ? vv.offsetTop : 0;
          root.style.setProperty("--app-visual-height", Math.round(h) + "px");
          root.style.setProperty("--app-visual-top", Math.round(t) + "px");
        }
        sync();
        addEventListener("resize", sync);
        addEventListener("orientationchange", sync);
        if (vv) {
          vv.addEventListener("resize", sync);
          vv.addEventListener("scroll", sync);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
